<!doctype html>
<html lang="ja">
<meta charset="utf-8" />
<title>resin-calib og card</title>
<!--
  共有カード（og:image）の原版。1200×630 で書き出して public/og.png にする。
  書き出しは ./scripts/og-card.sh（Chrome ヘッドレスのスクリーンショット）。

  意匠は resin-calib の顔（theme.css）に揃える。汎用の告知テンプレは使わない。
    - UV バイオレット/オーキッド（accent h288）＝ 405nm の UV 硬化を象徴する色
    - 寒色スレート（neutral h250）の暗い面 ＝ 造形チャンバー内の暗所
    - radius 10px の端正な角 ＝ 計器的な硬さ
  絵の中身は RERF（露光テスト）そのもの: 露光量を段階的に変えた試験片を並べ、
  細部（穴）が潰れる／太る手前の 1 枚が最適、という判定の仕方を絵で見せる。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    /* 造形チャンバーの暗所に、下から LCD の UV が差す。 */
    background:
      radial-gradient(115% 78% at 50% 122%, hsl(288 62% 40% / .60) 0%, hsl(288 60% 30% / .22) 38%, transparent 70%),
      linear-gradient(178deg, hsl(250 22% 12%) 0%, hsl(250 24% 8%) 100%);
    color: hsl(250 18% 96%);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }

  /* 微細な走査線。パネルの画素感を出す（主張はさせない）。 */
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, hsl(0 0% 100% / .022) 0 1px, transparent 1px 4px);
  }

  /* --- 上段: ブランドと見出し ------------------------------------------- */
  .head { position: absolute; top: 54px; left: 64px; right: 64px; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .mark {
    width: 46px; height: 46px; border-radius: 10px;
    background: linear-gradient(145deg, hsl(288 66% 62%), hsl(316 62% 50%));
    color: hsl(250 35% 10%);
    font-size: 27px; font-weight: 800; line-height: 46px; text-align: center;
    box-shadow: 0 0 22px hsl(288 70% 55% / .55);
  }
  .brand-name { font-size: 29px; font-weight: 700; letter-spacing: .02em; }
  .brand-sub {
    font-size: 19px; font-weight: 600; letter-spacing: .10em;
    color: hsl(288 44% 78%); padding-left: 15px; margin-left: 3px;
    border-left: 2px solid hsl(288 40% 60% / .45);
  }

  h1 { font-size: 55px; font-weight: 800; letter-spacing: -.005em; line-height: 1.24; }
  h1 em {
    font-style: normal;
    color: hsl(288 78% 74%);
    text-shadow: 0 0 26px hsl(288 80% 60% / .5);
  }
  .lead { margin-top: 18px; font-size: 24px; font-weight: 500; color: hsl(250 16% 76%); }

  /* --- 中段: RERF 露光ラダー -------------------------------------------- */
  /* 符号化は「穴の大きさ」1軸で通す。硬化不足は材料が立ち上がらず穴が大きく縁が
     荒れる、過硬化は硬化が回り込んで穴が埋まる。ぼかし（光学の語彙）は使わない。
     良好域は帯として示し、その下限に「推奨」を置く＝ app/lib/exposure.mjs が
     「確実に硬化した中で最も短い露光」を推奨するのと同じ判定則にする。 */
  .ladder { position: absolute; top: 282px; left: 64px; right: 64px; height: 226px; }

  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 24px; }

  /* 推奨の指し示し（良好域の下限＝4段目の上） */
  .rec { grid-column: 4; text-align: center; }
  .rec b {
    display: inline-block; font-size: 21px; font-weight: 800; letter-spacing: .04em;
    color: hsl(288 82% 80%);
    background: hsl(288 60% 50% / .22);
    border: 1px solid hsl(288 60% 66% / .5);
    border-radius: 999px; padding: 3px 14px; line-height: 1.25;
  }
  .rec span { display: block; font-size: 12px; line-height: 1; color: hsl(288 70% 72%); }

  .tiles { position: relative; margin-top: 6px; }

  /* 良好域の帯（4〜6段目の背後）。負マージンで枠外へ広げると、はみ出し検査に
     引っかかるうえ実際に段の外へ滲む。セルの内側に収め、下の「良好域」ラベルと
     同じ色味で縦に連なって見せる。 */
  .band {
    grid-row: 1; grid-column: 4 / 7; align-self: stretch;
    border-radius: 12px;
    background: hsl(288 55% 55% / .14);
    border: 1px solid hsl(288 55% 66% / .34);
  }

  .tile { grid-row: 1; position: relative; }
  .t1 { grid-column: 1; } .t2 { grid-column: 2; } .t3 { grid-column: 3; }
  .t4 { grid-column: 4; } .t5 { grid-column: 5; } .t6 { grid-column: 6; }
  .t7 { grid-column: 7; } .t8 { grid-column: 8; }

  /* 試験片。 */
  .chip {
    position: relative; width: 100%; height: 86px; border-radius: 10px;
    background: linear-gradient(160deg, hsl(268 26% 34%), hsl(258 24% 24%));
    border: 1px solid hsl(288 30% 62% / .32);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    place-content: center; padding: 12px;
  }
  /* 細部（穴）。ここが読めるかどうかが RERF の判定そのもの。 */
  .chip i { display: block; border-radius: 50%; background: hsl(250 30% 12%); width: 18px; height: 18px; }

  /* 硬化不足: 材料が立ち上がらず縁が荒れ、穴が大きすぎる。面も痩せる。 */
  .u3 .chip { opacity: .58; border-style: dashed; border-color: hsl(288 18% 58% / .38);
              background: linear-gradient(160deg, hsl(262 12% 30%), hsl(256 12% 22%)); }
  .u3 .chip i { width: 26px; height: 26px; }
  .u2 .chip { opacity: .74; border-style: dashed; border-color: hsl(288 20% 60% / .42);
              background: linear-gradient(160deg, hsl(264 16% 31%), hsl(257 16% 23%)); }
  .u2 .chip i { width: 23px; height: 23px; }
  .u1 .chip { opacity: .88; border-style: dashed; border-color: hsl(288 24% 62% / .46); }
  .u1 .chip i { width: 20px; height: 20px; }

  /* 良好域。下限（推奨）だけ縁を立てる。 */
  .g .chip {
    background: linear-gradient(160deg, hsl(288 34% 42%), hsl(272 30% 28%));
    border-color: hsl(288 60% 68% / .6);
  }
  .g.rec-step .chip {
    border-color: hsl(288 80% 74%);
    box-shadow: 0 0 0 3px hsl(288 78% 62% / .5), 0 0 28px hsl(288 80% 58% / .45);
  }

  /* 過硬化: 硬化が回り込んで穴が埋まり、縁が太る。輝度は上げすぎない
     （失敗側がカードで最も明るい面になると視線の主役が入れ替わる）。 */
  .o1 .chip { filter: brightness(1.16) saturate(.72); box-shadow: 0 0 0 2px hsl(288 12% 70% / .18); }
  .o1 .chip i { width: 10px; height: 10px; }
  .o2 .chip { filter: brightness(1.3) saturate(.5); box-shadow: 0 0 0 3px hsl(288 10% 72% / .2); }
  .o2 .chip i { width: 4px; height: 4px; opacity: .45; }

  .sec {
    margin-top: 10px; text-align: center;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 20px; font-weight: 600; color: hsl(250 14% 62%);
  }
  .g .sec { color: hsl(288 74% 80%); }

  /* 帯の意味を名指しする。両端が何の失敗なのかを書かないと、単なる明度ランプに見える。 */
  .zones { margin-top: 14px; }
  .zone {
    font-size: 20px; font-weight: 700; letter-spacing: .04em; text-align: center;
    padding: 5px 0; border-radius: 8px;
  }
  .z-under { grid-column: 1 / 4; color: hsl(250 14% 68%); background: hsl(250 20% 100% / .05); }
  .z-good  { grid-column: 4 / 7; color: hsl(288 80% 80%); background: hsl(288 55% 55% / .16); }
  .z-over  { grid-column: 7 / 9; color: hsl(250 14% 68%); background: hsl(250 20% 100% / .05); }

  /* --- 下段: 前提 -------------------------------------------------------- */
  .foot {
    position: absolute; left: 64px; bottom: 44px;
    display: flex; align-items: center; gap: 12px;
  }
  .pill {
    font-size: 20px; font-weight: 600; color: hsl(250 16% 80%);
    background: hsl(250 20% 100% / .07);
    border: 1px solid hsl(250 20% 100% / .13);
    border-radius: 999px; padding: 9px 20px;
  }
</style>

<div class="card">
  <div class="head">
    <div class="brand">
      <span class="mark">R</span>
      <span class="brand-name">レジンキャリブ</span>
      <span class="brand-sub">光造形 露光キャリブレーション</span>
    </div>
    <h1>露光の<em>最適解</em>を、勘で探さない。</h1>
    <p class="lead">機種 × レジン × 造形温度 × FEP の状態ごとに記録して、次から迷わない。</p>
  </div>

  <div class="ladder">
    <div class="row marks">
      <div class="rec"><b>推奨</b><span>&#9660;</span></div>
    </div>

    <div class="row tiles">
      <div class="band"></div>
      <div class="tile t1 u3"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">1.6s</div></div>
      <div class="tile t2 u2"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">2.0s</div></div>
      <div class="tile t3 u1"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">2.4s</div></div>
      <div class="tile t4 g rec-step"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">2.8s</div></div>
      <div class="tile t5 g"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">3.2s</div></div>
      <div class="tile t6 g"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">3.6s</div></div>
      <div class="tile t7 o1"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">4.0s</div></div>
      <div class="tile t8 o2"><div class="chip"><i></i><i></i><i></i><i></i></div><div class="sec">4.4s</div></div>
    </div>

    <div class="row zones">
      <div class="zone z-under">未硬化</div>
      <div class="zone z-good">良好域</div>
      <div class="zone z-over">過硬化</div>
    </div>
  </div>

  <div class="foot">
    <span class="pill">RERF テストから推定</span>
    <span class="pill">端末内に保存</span>
    <span class="pill">登録不要・無料</span>
  </div>
</div>

<script>
  // 書き出し前のレイアウト検査。寸法やファイルサイズでは拾えず、目視でも取りこぼす
  // 種類の破綻（はみ出し・主要ブロックの重なり）を機械的に落とす。
  // 結果は div#overflow-report に入れ、og-card.sh がそれだけを読む。
  window.addEventListener("load", function () {
    var bad = [];

    // --- 1. はみ出し ---
    document.querySelectorAll(".card *").forEach(function (el) {
      if (el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 1) {
        bad.push("横はみ出し " + (el.className || el.tagName) +
                 "(" + el.scrollWidth + ">" + el.clientWidth + ")");
      }
      if (el.clientHeight > 0 && el.scrollHeight > el.clientHeight + 1) {
        bad.push("縦はみ出し " + (el.className || el.tagName) +
                 "(" + el.scrollHeight + ">" + el.clientHeight + ")");
      }
    });

    // --- 2. 重なり（絶対配置の主要ブロック同士） ---
    // 3 段は互いに重なってはいけない。意図的に重ねている装飾は含めない。
    var names = [".head", ".ladder", ".foot"];
    var boxes = names.map(function (s) {
      var el = document.querySelector(s);
      return el ? { name: s, r: el.getBoundingClientRect() } : null;
    }).filter(Boolean);

    for (var i = 0; i < boxes.length; i++) {
      for (var j = i + 1; j < boxes.length; j++) {
        var a = boxes[i].r, b = boxes[j].r;
        // 丸め誤差で隣接を交差と誤検出しないよう 1px の余裕を持たせる。
        var dx = Math.min(a.right, b.right) - Math.max(a.left, b.left);
        var dy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
        if (dx > 1 && dy > 1) {
          bad.push("重なり " + boxes[i].name + "×" + boxes[j].name +
                   "(" + Math.round(dx) + "×" + Math.round(dy) + "px)");
        }
      }
    }

    // --- 3. 段どうしの最小クリアランス ---
    // 交差だけを見ていると 1px 空いていれば合格してしまう。実際には「重なってはいないが
    // 詰まりすぎ」が目視で最も見落としやすい破綻なので、必要な余白そのものを表明する。
    var MIN_GAP = 28;
    var byTop = boxes.slice().sort(function (a, b) { return a.r.top - b.r.top; });
    for (var k = 0; k + 1 < byTop.length; k++) {
      var gap = byTop[k + 1].r.top - byTop[k].r.bottom;
      // 小数の高さで 27.6px が "28px < 28px" と表示されないよう、丸め分だけ許容する。
      if (gap < MIN_GAP - 0.5) {
        bad.push("間隔不足 " + byTop[k].name + "→" + byTop[k + 1].name +
                 "(" + gap.toFixed(1) + "px < " + MIN_GAP + "px)");
      }
    }

    // --- 4. カード外への飛び出し ---
    boxes.forEach(function (b) {
      if (b.r.bottom > 631 || b.r.right > 1201 || b.r.top < -1 || b.r.left < -1) {
        bad.push("枠外 " + b.name + "(" + Math.round(b.r.left) + "," + Math.round(b.r.top) +
                 " " + Math.round(b.r.right) + "," + Math.round(b.r.bottom) + ")");
      }
    });

    var m = document.createElement("div");
    m.id = "overflow-report";
    m.hidden = true;
    m.textContent = bad.length ? "LAYOUT_FAIL:" + bad.join(" / ") : "LAYOUT_OK";
    document.body.appendChild(m);
  });
</script>
</html>
